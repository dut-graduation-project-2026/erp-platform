databaseChangeLog:
  - changeSet:
      id: 037-alter-warehouses-add-columns
      author: halwins
      changes:
        - addColumn:
            tableName: warehouses
            columns:
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: contact_person_id
                  type: UUID
              - column:
                  name: manager_id
                  type: UUID
              - column:
                  name: maximum_capacity
                  type: DECIMAL(30, 10)
              - column:
                  name: used_capacity
                  type: DECIMAL(30, 10)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_warehouses_contact_person
            baseTableName: warehouses
            baseColumnNames: contact_person_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_warehouses_manager
            baseTableName: warehouses
            baseColumnNames: manager_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE
