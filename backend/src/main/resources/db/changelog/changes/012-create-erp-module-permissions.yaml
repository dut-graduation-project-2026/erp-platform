databaseChangeLog:
  - changeSet:
      id: 012-create-erp-module-permissions-table
      author: halwins
      changes:
        - createTable:
            tableName: erp_module_permissions
            columns:
              - column:
                  name: erp_module_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: erp_module_permissions
            columnNames: erp_module_id, permission_id
            constraintName: pk_erp_module_permissions
        - addForeignKeyConstraint:
            constraintName: fk_erp_module_permissions_module
            baseTableName: erp_module_permissions
            baseColumnNames: erp_module_id
            referencedTableName: erp_modules
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_erp_module_permissions_permission
            baseTableName: erp_module_permissions
            baseColumnNames: permission_id
            referencedTableName: permissions
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
