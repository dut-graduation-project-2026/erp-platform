databaseChangeLog:
  - changeSet:
      id: 012-init-erp-module-and-permissions
      author: halwins
      changes:
        - insert:
            tableName: erp_modules
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: ERP Module
              - column:
                  name: code
                  value: erp_module
              - column:
                  name: description
                  value: Centralized management and configuration of ERP system modules.

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: erp_module:read
              - column:
                  name: code
                  value: erp_module:read
              - column:
                  name: description
                  value: Allow viewing of ERP module details and configurations.
              - column:
                  name: module_id
                  valueComputed: (SELECT id FROM erp_modules WHERE code = 'erp_module')

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: erp_module:modify
              - column:
                  name: code
                  value: erp_module:modify
              - column:
                  name: description
                  value: Allow modifying ERP module configurations.
              - column:
                  name: module_id
                  valueComputed: (SELECT id FROM erp_modules WHERE code = 'erp_module')

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: erp_module:manage
              - column:
                  name: code
                  value: erp_module:manage
              - column:
                  name: description
                  value: Allow full management of ERP modules including creation and deletion.
              - column:
                  name: module_id
                  valueComputed: (SELECT id FROM erp_modules WHERE code = 'erp_module')
