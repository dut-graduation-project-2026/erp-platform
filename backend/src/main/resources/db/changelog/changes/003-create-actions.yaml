databaseChangeLog:
  - changeSet:
      id: 003-create-actions-table
      author: copilot
      changes:
        - createTable:
            tableName: actions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_actions
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: actions
            columnNames: name
            constraintName: uk_actions_name

