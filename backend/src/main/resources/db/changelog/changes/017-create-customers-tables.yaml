databaseChangeLog:
  - changeSet:
      id: 017-create-customers-tables
      author: halwins
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_customers_organization
                    referencedTableName: organizations
                    referencedColumnNames: id
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: customer_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: tax_code
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(50)
              - column:
                  name: address
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    foreignKeyName: fk_customers_created_by
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: updated_by
                  type: UUID
                  constraints:
                    foreignKeyName: fk_customers_updated_by
                    referencedTableName: users
                    referencedColumnNames: id
        - addUniqueConstraint:
            tableName: customers
            columnNames: organization_id, code
            constraintName: uk_customers_org_code

        - createTable:
            tableName: customer_contacts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_contacts_customer
                    referencedTableName: customers
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(50)
              - column:
                  name: position
                  type: VARCHAR(100)
              - column:
                  name: is_primary
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    foreignKeyName: fk_contacts_created_by
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: updated_by
                  type: UUID
                  constraints:
                    foreignKeyName: fk_contacts_updated_by
                    referencedTableName: users
                    referencedColumnNames: id
