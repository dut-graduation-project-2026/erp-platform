databaseChangeLog:
  - changeSet:
      id: 032-init-inventory-module-and-permissions
      author: halwins
      changes:
        # ---- ERP Modules ----
        - insert:
            tableName: erp_modules
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: Inventory
              - column:
                  name: code
                  value: inventory
              - column:
                  name: description
                  value: Management of warehouses, stock levels, operations, adjustments, and valuations.

        # ---- Warehouse Permissions ----
        - insert:
            tableName: permissions
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: warehouses:select
              - column:
                  name: code
                  value: warehouses:select
              - column:
                  name: description
                  value: Allow listing warehouses.
              - column:
                  name: module_id
                  valueComputed: (SELECT id FROM erp_modules WHERE code = 'inventory')

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: warehouses:read
              - column:
                  name: code
                  value: warehouses:read
              - column:
                  name: description
                  value: Allow reading warehouse details.
              - column:
