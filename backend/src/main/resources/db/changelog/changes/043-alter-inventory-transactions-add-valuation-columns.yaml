databaseChangeLog:
  - changeSet:
      id: 043-alter-inventory-transactions-add-valuation-columns
      author: halwins
      changes:
        - addColumn:
            tableName: inventory_transactions
            columns:
              - column:
                  name: unit_cost
                  type: DECIMAL(15, 4)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: valuation
                  type: DECIMAL(15, 4)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
