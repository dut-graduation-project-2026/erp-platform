databaseChangeLog:
  - changeSet:
      id: 035-create-stock-pickings-table
      author: halwins
      changes:
        - createTable:
            tableName: stock_picking
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_stock_picking
                    nullable: false
              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: picking_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: location_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: location_dest_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: partner_id
                  type: UUID
              - column:
                  name: sale_order_id
                  type: UUID
              - column:
                  name: purchase_order_id
                  type: UUID
              - column:
                  name: state
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_date
                  type: TIMESTAMP
              - column:
                  name: date_done
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_by
                  type: UUID
        - addForeignKeyConstraint:
            constraintName: fk_stock_picking_organization
            baseTableName: stock_picking
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_stock_picking_location
            baseTableName: stock_picking
            baseColumnNames: location_id
            referencedTableName: stock_location
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_stock_picking_location_dest
            baseTableName: stock_picking
            baseColumnNames: location_dest_id
            referencedTableName: stock_location
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_stock_picking_partner
            baseTableName: stock_picking
            baseColumnNames: partner_id
            referencedTableName: sale_partners
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_stock_picking_sale_order
            baseTableName: stock_picking
            baseColumnNames: sale_order_id
            referencedTableName: sale_orders
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE
