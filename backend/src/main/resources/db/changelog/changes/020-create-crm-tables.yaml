        - addForeignKeyConstraint:
            constraintName: fk_crm_appointments_lead
            baseTableName: crm_appointments
            baseColumnNames: lead_id
            referencedTableName: crm_leads
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
