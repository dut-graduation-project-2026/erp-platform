  - changeSet:
      id: 020-create-crm-leads-table
      author: halwins
      changes:
        - createTable:
            tableName: crm_leads
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_crm_leads
                    nullable: false
              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: partner_id
                  type: UUID
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expected_revenue
                  type: DECIMAL(15,2)
                  defaultValueNumeric: 0.00
              - column:
                  name: probability
                  type: DECIMAL(5,2)
              - column:
                  name: stage_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: salesperson_id
                  type: UUID
              - column:
                  name: sales_team_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_by
                  type: UUID
        - addForeignKeyConstraint:
            constraintName: fk_crm_leads_organization
            baseTableName: crm_leads
            baseColumnNames: organization_id
