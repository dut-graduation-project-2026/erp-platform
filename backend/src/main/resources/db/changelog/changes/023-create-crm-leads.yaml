databaseChangeLog:
  - changeSet:
      id: 023-create-crm-leads-table
      author: halwins
      changes:
        - createTable:
            tableName: crm_leads
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_crm_leads
                    nullable: false
              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: partner_id
                  type: UUID
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expected_revenue
                  type: DECIMAL(15,2)
                  defaultValueNumeric: 0.00
              - column:
                  name: probability
                  type: DECIMAL(5,2)
              - column:
                  name: stage_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: salesperson_id
                  type: UUID
              - column:
                  name: sales_team_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_by
                  type: UUID
        - addForeignKeyConstraint:
            constraintName: fk_crm_leads_organization
            baseTableName: crm_leads
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_crm_leads_partner
            baseTableName: crm_leads
            baseColumnNames: partner_id
            referencedTableName: sale_partners
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_crm_leads_stage
            baseTableName: crm_leads
            baseColumnNames: stage_id
            referencedTableName: crm_stages
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_crm_leads_salesperson
            baseTableName: crm_leads
            baseColumnNames: salesperson_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_crm_leads_sales_team
            baseTableName: crm_leads
            baseColumnNames: sales_team_id
            referencedTableName: sales_teams
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_crm_leads_created_by
            baseTableName: crm_leads
            baseColumnNames: created_by
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_crm_leads_updated_by
            baseTableName: crm_leads
            baseColumnNames: updated_by
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE
