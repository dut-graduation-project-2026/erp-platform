databaseChangeLog:
  - changeSet:
      id: 013-init-organization-module-and-permissions
      author: halwins
      changes:
        - insert:
            tableName: erp_modules
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: Organizations Module
              - column:
                  name: code
                  value: organizations
              - column:
                  name: description
                  value: Module for organization management and access control.

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: organizations:read
              - column:
                  name: code
                  value: organizations:read
              - column:
                  name: description
                  value: Allow reading organization information.
              - column:
                  name: module_id
                  valueComputed: (SELECT id FROM erp_modules WHERE code = 'organizations')

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: organizations:modify
              - column:
                  name: code
                  value: organizations:modify
              - column:
                  name: description
                  value: Allow modifying existing organization data.
              - column:
                  name: module_id
                  valueComputed: (SELECT id FROM erp_modules WHERE code = 'organizations')

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: organizations:manage
              - column:
                  name: code
                  value: organizations:manage
              - column:
                  name: description
                  value: Allow full management of organizations including creation and deletion.
              - column:
                  name: module_id
                  valueComputed: (SELECT id FROM erp_modules WHERE code = 'organizations')
