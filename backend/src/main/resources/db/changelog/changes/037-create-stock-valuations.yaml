databaseChangeLog:
  - changeSet:
      id: 037-create-stock-valuations-table
      author: halwins
      changes:
        - createTable:
            tableName: stock_valuation
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_stock_valuation
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: move_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: DECIMAL(15,4)
                  constraints:
                    nullable: false
              - column:
                  name: unit_value
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: total_value
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: remaining_qty
                  type: DECIMAL(15,4)
              - column:
                  name: remaining_value
                  type: DECIMAL(15,2)
              - column:
                  name: method
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_stock_valuation_product
            baseTableName: stock_valuation
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_stock_valuation_move
            baseTableName: stock_valuation
            baseColumnNames: move_id
            referencedTableName: stock_move
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
