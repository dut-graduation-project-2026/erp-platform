name: Unified Deployment

on:
  workflow_dispatch:
    inputs:
      backend_commit_sha:
        description: 'Backend commit SHA (defaults to github.sha)'
        required: false
        type: string

concurrency:
  group: unified-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      backend_commit_sha: ${{ steps.resolve.outputs.backend_commit_sha }}
    steps:
      - name: Validate branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/dev" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Error: deployments are only allowed from dev or main branches"
            exit 1
          fi

      - name: Resolve backend commit SHA
        id: resolve
        run: |
          commit_sha="${{ github.event.inputs.backend_commit_sha }}"

          if [ -z "$commit_sha" ]; then
            commit_sha="${{ github.sha }}"
          fi

          if ! echo "$commit_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Error: backend_commit_sha must be a 40-char lowercase hex SHA"
            exit 1
          fi

          echo "backend_commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

  deploy-backend:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify immutable image exists
        run: |
          docker_user=$(echo "${{ secrets.DOCKERHUB_USER }}" | tr '[:upper:]' '[:lower:]')
          docker manifest inspect ${docker_user}/erp-platform:${{ needs.validate.outputs.backend_commit_sha }} > /dev/null

      - name: Promote immutable image to latest
        run: |
          docker_user=$(echo "${{ secrets.DOCKERHUB_USER }}" | tr '[:upper:]' '[:lower:]')
          docker pull ${docker_user}/erp-platform:${{ needs.validate.outputs.backend_commit_sha }}
          docker tag ${docker_user}/erp-platform:${{ needs.validate.outputs.backend_commit_sha }} ${docker_user}/erp-platform:latest
          docker push ${docker_user}/erp-platform:latest

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK is not configured"
            exit 1
          fi

          echo "Waiting 15s for DockerHub registry to fully index the latest tag..."
          sleep 15

          curl --fail --silent --show-error --max-time 30 --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook triggered successfully."

  summary:
    if: always()
    needs:
      - validate
      - deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          {
            echo "## Backend Deployment Summary"
            echo "- Backend commit SHA: ${{ needs.validate.outputs.backend_commit_sha }}"
            echo "- Validate: ${{ needs.validate.result }}"
            echo "- Backend: ${{ needs.deploy-backend.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
